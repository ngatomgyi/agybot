[project]
name = "agybot"
version = "0.1.0"
description = "Telegram bot that bridges Telegram Forum topics to Google Antigravity (agy) sessions via tmux windows"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "ngatomgyi" }]
keywords = ["antigravity", "telegram", "tmux", "ai-agent", "gemini", "developer-tools"]
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot[rate-limiter]>=21.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "libtmux>=0.37.0",
    "Pillow>=10.0.0",
    "aiofiles>=24.0.0",
    "telegramify-markdown>=0.5.0,<1.0.0",
]

[project.urls]
Homepage = "https://github.com/ngatomgyi/agybot"
Repository = "https://github.com/ngatomgyi/agybot"
Issues = "https://github.com/ngatomgyi/agybot/issues"

[project.scripts]
agybot = "agybot.main:main"

[project.optional-dependencies]
dev = [
    "pyright>=1.1.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agybot"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
